# herdr 設定 (tmux からの移行。dot_config/tmux/ はフォールバックとして残置)
# スキーマ全体: herdr --default-config

onboarding = false

[theme]
# home/theme.nix と同じ Catppuccin Latte 相当のビルトイン
name = "catppuccin-latte"

# 生成できないため home/theme.nix と手動で揃える: panel_bg = mantle / text = text / accent = blue /
# mauve・green・yellow・red・blue・teal・peach = 同名の色 (マット化したアクセント)。
# チュロームはペイン背景 (base #dce0e8) より一段暗くする
auto_switch = false
[theme.custom]
panel_bg = "#d3d8e2"
text = "#44455d"
# accent はフォーカス中ペインの枠線、選択中タブの背景、navigate やメニューの強調色。
# エージェントの状態色 (green = idle / teal = done / yellow = working / red = blocked) と
# 被らない blue にする。Neovim の浮動ウィンドウの枠と Claude Code の確認ダイアログの枠も同じ blue
# (非フォーカス枠の overlay0 #9ca0b0 との OKLab ΔE は 0.201。overlay0 は
#  サイドバー見出しにも使われるため薄くして差を稼ぐことはしない)
accent = "#416bb0"
mauve = "#69499c"
green = "#47894f"
yellow = "#bd8a40"
red = "#a03e43"
blue = "#416bb0"
teal = "#2a797c"
peach = "#c46f49"

[keys]
# tmux と同じ prefix (C-s)
prefix = "ctrl+s"

# goto (セッションナビゲーター: workspace/tab/pane のツリーを名前で絞り込んで移動) は
# デフォルトの prefix+g を lazygit に譲り、prefix+f で開く
goto = "prefix+f"

# デフォルトの open_notification_target (prefix+o) は in-app トースト表示中しか効かず、
# delivery = "terminal" では常に no-op。代わりにエージェント巡回を割り当てる。
# agent_panel_sort = "priority" なので、最初の一押しで blocked (入力待ち) の
# エージェントへ飛び、連打で次のエージェントへ巡回する
next_agent = "prefix+o"
previous_agent = "prefix+shift+o"

# navigate モード (prefix+w) 中は j/k で workspace を上下移動。
# デフォルトでは j/k がペインの上下移動なので、ペインの上下は矢印キーに回す
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# resize モード (prefix+r) に入らず 1 打でペインの大きさを変える。
# option+文字は配列によって Ghostty が記号入力にするため、矢印と組み合わせる
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# アクティブなタブを左右に並べ替える (端では反対側へ回り込む)
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# lazygit をテンポラリペインで開く (tmux の prefix+g popup 相当)
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"
description = "lazygit"

# C-h/j/k/l で prefix なしペイン移動 (tmux の is_vim 分岐を herdr-navigate で再現。
# vim ならキーを転送し vim 内のウィンドウ移動を優先、それ以外はペイン移動)。
# type = "shell" のゾンビリークは 0.7.4 で修正済みのため herdr 0.7.4 以上が必須
# (0.7.1〜0.7.3 ではゾンビ蓄積 → fork EAGAIN が再発する。pkgs/herdr.nix の overlay 参照)。
# SSH 先など herdr 外用のフォールバックとして nvim (keymaps.lua) と
# zsh (.zshrc の herdr-focus ウィジェット) にも同じ移動が実装してある
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "herdr-navigate left"
description = "pane left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "herdr-navigate down"
description = "pane down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "herdr-navigate up"
description = "pane up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "herdr-navigate right"
description = "pane right (vim-aware)"

# 変更セットレビュー (hunk)。--watch で Claude の編集に追従
[[keys.command]]
key = "prefix+shift+h"
type = "pane"
command = "hunk diff --watch"
description = "hunk diff"

# 外枠とタブバー右端のステータスの表示を切り替える ([ui] の該当行を herdr-toggle が書き換える)
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "herdr-toggle borders"
description = "toggle outer borders"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "herdr-toggle status"
description = "toggle tab bar status"

[ui]
# blocked (入力待ち) のエージェントを一番上に出す
agent_panel_sort = "priority"
# herdr-toggle status がステータスと連動して切り替える
hide_tab_bar_when_single_tab = true
# 境界線を隣接ペインで共有して仕切りを薄くする (デフォルト true は隙間が太い)
pane_gaps = false
# 外枠を消し、tmux のようにペインの間の仕切り線だけにする (herdr-toggle borders で切り替え)
pane_outer_borders = false
# タブバー右端にズーム中の ZOOM と日時を出す (herdr-toggle status でコメントを付け外しする)
# tab_bar_right = [{ type = "zoom" }, { type = "datetime", format = "%m/%d (%a) %H:%M" }]

# エージェント状態変化は Ghostty のデスクトップ通知へ (tmux allow-passthrough と同じ役割)
[ui.toast]
delivery = "terminal"

# 音は OS ミュート前提で無効 (tmux visual-bell off と同じ思想)
[ui.sound]
enabled = false

[experimental]
# 日本語 IME 有効のまま prefix を押してもコマンドが効くよう、
# prefix モード中だけ ASCII 入力ソースへ一時切替 (macOS, best-effort)
switch_ascii_input_source_in_prefix = true
