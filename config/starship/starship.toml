"$schema" = 'https://starship.rs/config-schema.json'

# 出すのは format に並べたモジュールだけ。
# 言語のバージョン (python・node など) は出さない。mise はグローバル設定だけで運用しており
# どのディレクトリでも同じ値になるうえ、mise の shim 経由で 1 言語ごとに 30〜40ms かかるため。
# 色は ANSI 名で指定する。実際の色は Ghostty のパレット (home/theme.nix) が決める。
# Ghostty は太字を無効にしているので bold は付けない。
# git の変更状態 (git_status) も出さない。プロンプトの描画時間の大半を占めるため。
# 表示は Claude Code の statusline (claude/statusline.sh) に揃える (ディレクトリ blue・ブランチ green ⎇)
format = """
$directory\
$git_branch\
$git_state\
$nix_shell\
$jobs\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "blue"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "⎇ "
style = "green"
format = "[$symbol$branch(:$remote_branch)]($style) "

# rebase・merge などの途中であることを示す
[git_state]
style = "yellow"

[nix_shell]
symbol = " "
style = "purple"
format = "[$symbol$name]($style) "

[jobs]
style = "bright-black"

# 2 秒以上かかったコマンドの所要時間
[cmd_duration]
style = "bright-black"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
